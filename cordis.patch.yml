# dsh-web-search-yuanbao 的 bundle 补丁层。
#
# 1) 把 provider 插进插件树：id 供后续层（profile 的 cordis.patch.yml）按需覆盖。
# 2) 把 ctx.web 的 searchProvider 指向它。
#
# 注意：补丁对同一行是「整段替换 config，不做深合并」，所以覆盖 `web` 行时
# 必须把 fetchProvider 一并重申，否则抓取能力会失去 provider。
- insert:
    - id: web-search-yuanbao
      name: 'dsh-web-search-yuanbao'
      config:
        # 密钥引用名：可被 credentials 服务或启动环境变量满足。
        apiKeyEnv: TENCENTCLOUD_WSA_APIKEY
        timeoutMs: 20000
        snippetChars: 500
        # auto = 由服务端 Response.Version 自动判定；也可强制 lite/standard/flagship
        version: auto
        # 是否注册模型可调用的 yuanbao_search 工具
        exposeTool: true
        # 以下是可选的默认参数（也可在设置页里改，或由模型按次覆盖）
        # mode: 0
        # site: 'zhihu.com'
        # industry: 'news'
        # freshness: 'y1'

# 选中元宝搜索。想切回内置搜索时，在 profile 的 cordis.patch.yml 里写
# `- id: web` + `config.searchProvider: deepseek-official`（或设
# DSH_WEB_SEARCH_PROVIDER=deepseek-official 启动）。
- id: web
  config:
    searchProvider: yuanbao
    fetchProvider: http
